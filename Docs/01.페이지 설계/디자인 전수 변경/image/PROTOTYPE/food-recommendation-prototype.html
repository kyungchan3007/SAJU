<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAJU:ME — 오늘의 음식 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { font-family: "Malgun Gothic", "맑은 고딕", sans-serif !important; }
    body { background: #F4F2FC; color: #111827; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── NAV ── */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.97); backdrop-filter: blur(10px); border-bottom: 1px solid #F3F4F6; height: 56px; }
    .nav-inner { max-width: 1152px; margin: 0 auto; padding: 0 24px; height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-logo-mark { font-weight: 900; font-size: 13px; letter-spacing: -0.5px; color: #111827; }
    .nav-logo-sub { font-size: 9px; color: #9CA3AF; margin-top: -2px; }
    .nav-links { display: flex; align-items: center; gap: 24px; list-style: none; }
    .nav-links a { font-size: 13px; font-weight: 500; color: #6B7280; text-decoration: none; }
    .nav-links a:hover { color: #5956E9; }
    .nav-links a.active { color: #5956E9; font-weight: 700; border-bottom: 2px solid #5956E9; padding-bottom: 1px; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .nav-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #93C5FD, #6366F1); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 700; }

    /* ── 공통 카드 ── */
    .card { background: white; border-radius: 20px; border: 1px solid #F3F4F6; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }

    /* ── ctx-header ── */
    .ctx-header { background: linear-gradient(135deg, #5956E9 0%, #7C3AED 100%); border-radius: 24px; padding: 24px; box-shadow: 0 8px 32px rgba(89,86,233,0.28); }

    /* ── 오행 에너지 바 ── */
    .elem-bar-row { display: flex; align-items: center; gap: 8px; }
    .elem-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.2); border-radius: 999px; overflow: hidden; }
    .elem-bar-fill { height: 100%; border-radius: 999px; }

    /* ── 1위 카드 ── */
    .rank1-card { background: #F0EEFF; border: 2px solid #5956E9; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; box-shadow: 0 4px 20px rgba(89,86,233,0.15); }

    /* ── 2~5위 리스트 ── */
    .rank-list-card { background: white; border-radius: 20px; border: 1px solid #F3F4F6; box-shadow: 0 2px 16px rgba(0,0,0,0.06); overflow: hidden; }
    .rank-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid #F9FAFB; cursor: pointer; transition: background 0.15s; }
    .rank-item:last-child { border-bottom: none; }
    .rank-item:hover { background: #FAFAFA; }
    .rank-item-detail { display: none; padding: 0 20px 14px; font-size: 12px; color: #6B7280; line-height: 1.7; background: #FAFAFA; border-bottom: 1px solid #F3F4F6; }
    .rank-item-detail.open { display: block; }
    .rank-item-detail:last-child { border-bottom: none; }

    /* ── 오행 태그 ── */
    .elem-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }

    /* ── 그룹 태그 ── */
    .group-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #F3F4F6; color: #6B7280; }

    /* ── 피해야 할 음식 ── */
    .avoid-card { background: #FFF5F5; border: 1px solid #FEE2E2; border-radius: 20px; padding: 20px; }

    /* ── 식재료 태그 ── */
    .ingredient-tag { display: inline-flex; padding: 6px 14px; border-radius: 999px; background: #F0EEFF; color: #5956E9; font-size: 13px; font-weight: 700; }

    /* ── 페이드인 ── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease-out; }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="nav-logo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1L16 5V13L9 17L2 13V5L9 1Z" fill="#5956E9"/></svg>
      <div><div class="nav-logo-mark">SAJU:ME</div><div class="nav-logo-sub">정통사주로 해석하는 나의 명식</div></div>
    </a>
    <ul class="nav-links">
      <li><a href="#" class="active">오늘의운세</a></li>
      <li><a href="#">정통사주</a></li>
      <li><a href="#">궁합</a></li>
      <li><a href="#">타로</a></li>
      <li><a href="#">커뮤니티</a></li>
      <li><a href="#">마이페이지</a></li>
    </ul>
    <div class="nav-actions">
      <svg width="20" height="20" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      <div class="nav-avatar">수</div>
    </div>
  </div>
</nav>

<!-- ── 결과 화면 ── -->
<main class="flex-1 px-4 py-6 mt-14 max-w-lg mx-auto w-full flex flex-col gap-5 fade-in">

  <!-- ① 오늘의 오행 컨텍스트 -->
  <div class="ctx-header">
    <div class="flex items-center gap-2 mb-3 flex-wrap">
      <span class="text-xs font-bold px-3 py-1 rounded-full bg-white/20 text-white">오늘의 음식 추천</span>
      <span class="text-xs font-bold px-3 py-1 rounded-full bg-white/20 text-white" id="result-date"></span>
    </div>
    <div class="flex items-center gap-3 mb-2 flex-wrap">
      <div class="text-3xl font-black text-white" id="result-pillar" style="font-family:'Noto Serif KR',serif;"></div>
      <div class="text-sm font-bold px-3 py-1 rounded-full bg-white/20 text-white" id="result-elem-badge"></div>
    </div>
    <p class="text-sm text-white/80 mb-4" id="result-desc"></p>
    <!-- 오행 에너지 바 -->
    <div class="flex flex-col gap-2" id="element-bars"></div>
  </div>

  <!-- ② 추천 음식 -->
  <div>
    <div class="flex items-center gap-2 mb-3">
      <div class="w-7 h-7 rounded-full flex items-center justify-center" style="background:#F0EEFF;">
        <i data-lucide="utensils" style="width:13px;height:13px;color:#5956E9;"></i>
      </div>
      <span class="font-black text-base">오늘의 추천 메뉴</span>
      <span class="text-xs text-slate-400 font-semibold ml-auto">최대 5개</span>
    </div>

    <!-- 1위 히어로 카드 -->
    <div class="rank1-card mb-3" id="rank1-card"></div>

    <!-- 2~5위 리스트 -->
    <div class="rank-list-card" id="rank-list-card"></div>
  </div>

  <!-- ③ 피해야 할 음식 -->
  <div class="avoid-card" id="avoid-card"></div>

  <!-- ④ 오늘의 추천 식재료 -->
  <div class="card p-5">
    <div class="flex items-center gap-2 mb-3">
      <div class="w-7 h-7 rounded-full flex items-center justify-center" style="background:#F0EEFF;">
        <i data-lucide="shopping-basket" style="width:13px;height:13px;color:#5956E9;"></i>
      </div>
      <span class="font-bold text-sm">오늘 장봐야 한다면</span>
    </div>
    <div class="flex flex-wrap gap-2" id="ingredient-tags"></div>
  </div>

  <!-- ⑤ CTA -->
  <div class="flex flex-col gap-3 pb-6">
    <button class="w-full py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 text-white transition-all hover:opacity-90"
      style="background:linear-gradient(to right,#5956E9,#7C3AED);box-shadow:0 4px 20px rgba(89,86,233,0.28);">
      <i data-lucide="user-circle" style="width:15px;height:15px;"></i>
      내 사주 프로필 보기
    </button>
  </div>

</main>

<!-- ── FOOTER ── -->
<footer style="background:#F9FAFB;border-top:1px solid #F3F4F6;padding:40px 32px;margin-top:auto;">
  <div style="max-width:1152px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;">
    <div>
      <div style="font-weight:800;font-size:15px;color:#111827;margin-bottom:4px;">SAJU:ME</div>
      <div style="font-size:12px;color:#9CA3AF;">© 2026 SAJU:ME. All rights reserved.</div>
    </div>
    <div style="display:flex;gap:24px;">
      <a href="#" style="font-size:13px;color:#9CA3AF;text-decoration:none;">Privacy Policy</a>
      <a href="#" style="font-size:13px;color:#9CA3AF;text-decoration:none;">Terms of Service</a>
      <a href="#" style="font-size:13px;color:#9CA3AF;text-decoration:none;">Contact Us</a>
    </div>
  </div>
</footer>

<script>
lucide.createIcons();

// ────────────────────────────────────────────
// FOOD ENUM — 전체 사전 정의
// ────────────────────────────────────────────
const GROUP_ENUM = {
  korean: { label: '한식', emoji: '🍲' },
  grill:  { label: '구이', emoji: '🔥' },
};

const FOOD_ENUM = {
  // 한식
  naengmyeon:   { name: '냉면',     group: 'korean', element: '목', emoji: '🍜', reason: '시원하고 가벼운 목(木) 기운으로 몸의 순환을 도와줘요' },
  gukbap:       { name: '국밥',     group: 'korean', element: '토', emoji: '🥣', reason: '든든한 국물이 토(土) 기운으로 오늘의 체력을 채워줘요' },
  banchan:      { name: '반찬',     group: 'korean', element: '토', emoji: '🥗', reason: '다양한 나물 반찬이 균형 잡힌 토(土) 기운을 공급해요' },
  jimdak:       { name: '찜닭',     group: 'korean', element: '토', emoji: '🍗', reason: '달콤짭짤한 간장 소스가 토(土) 기운으로 안정을 줘요' },
  kalguksu:     { name: '칼국수',   group: 'korean', element: '목', emoji: '🍝', reason: '따뜻한 국물 속 면 요리가 목(木) 기운의 생명력을 더해줘요' },
  gamjatang:    { name: '감자탕',   group: 'korean', element: '토', emoji: '🍲', reason: '진한 뼈 국물이 토(土) 기운으로 몸의 중심을 잡아줘요' },
  budaejjigae:  { name: '부대찌개', group: 'korean', element: '화', emoji: '🍲', reason: '얼큰한 매운 기운이 화(火) 에너지로 기분을 끌어올려요' },
  kimchijjim:   { name: '김치찜',   group: 'korean', element: '화', emoji: '🥘', reason: '불 위에서 오래 끓인 깊은 맛이 화(火) 기운을 보충해줘요' },
  samgyeopsal:  { name: '삼겹살',   group: 'korean', element: '금', emoji: '🥩', reason: '구운 고기의 담백함이 금(金) 기운으로 결단력을 높여줘요' },
  kimchijjigae: { name: '김치찌개', group: 'korean', element: '화', emoji: '🍲', reason: '따뜻한 불 기운이 오늘의 수(水) 냉기를 보완해줘요' },
  chicken:      { name: '치킨',     group: 'korean', element: '금', emoji: '🍗', reason: '바삭한 튀김의 금(金) 기운이 오늘의 판단력을 높여줘요' },
  bunsik:       { name: '분식',     group: 'korean', element: '목', emoji: '🥟', reason: '가볍고 활기찬 목(木) 기운으로 오후 에너지를 충전해요' },
  // 구이
  gopchang:     { name: '곱창',     group: 'grill',  element: '수', emoji: '🔥', reason: '깊고 진한 수(水) 기운이 오늘의 집중력을 높여줘요' },
  galbi:        { name: '갈비',     group: 'grill',  element: '수', emoji: '🥩', reason: '풍부한 육즙의 수(水) 기운이 오늘 몸의 활력을 채워줘요' },
  samgyeop_g:   { name: '삼겹살',   group: 'grill',  element: '수', emoji: '🥩', reason: '불 위에서 익힌 고소함이 오늘 기운 균형을 잡아줘요' },
  // 그룹 없음
  sandwich:     { name: '샌드위치', group: null, element: '목', emoji: '🥪', reason: '신선한 채소와 목(木) 기운이 아침을 가볍게 시작하게 해요' },
  hamburger:    { name: '햄버거',   group: null, element: '금', emoji: '🍔', reason: '든든한 금(金) 기운으로 오늘의 실행력을 올려줘요' },
  donkkaseu:    { name: '돈까스',   group: null, element: '금', emoji: '🍱', reason: '바삭하고 고소한 금(金) 기운이 결단의 에너지를 줘요' },
  jokbal:       { name: '족발',     group: null, element: '수', emoji: '🦵', reason: '콜라겐 가득한 수(水) 기운이 오늘 컨디션을 회복시켜요' },
  bossam:       { name: '보쌈',     group: null, element: '금', emoji: '🥬', reason: '담백한 금(金) 기운이 오늘의 냉철한 판단을 도와줘요' },
  pizza:        { name: '피자',     group: null, element: '수', emoji: '🍕', reason: '다양한 재료의 수(Water) 기운이 오늘 창의력을 자극해요' },
  ssalnoodle:   { name: '쌀국수',   group: null, element: '목', emoji: '🍜', reason: '가볍고 맑은 목(木) 기운이 몸과 마음을 정화해줘요' },
  mexican:      { name: '멕시칸',   group: null, element: '화', emoji: '🌮', reason: '매콤하고 강렬한 화(火) 기운이 오늘의 열정을 불태워요' },
  juk:          { name: '죽',       group: null, element: '토', emoji: '🍚', reason: '부드러운 토(土) 기운이 오늘 지친 몸을 포근하게 달래줘요' },
};

// ────────────────────────────────────────────
// MOCK API 응답 (실제 API 연동 시 교체)
// ────────────────────────────────────────────
const MOCK_API = {
  dailyPillar:     '壬子',
  todayElement:    '수',
  elementScores:   { 목: 30, 화: 45, 토: 50, 금: 35, 수: 85 },
  recommendations: ['kimchijjigae', 'jimdak', 'galbi', 'juk', 'bossam'], // 최대 5개 key
  avoid:           ['naengmyeon', 'pizza'],
  avoidReason:     '오늘 水 기운이 이미 강해 차갑고 짠 음식은 과하지 않게 드세요',
  ingredients:     ['검은콩', '두부', '미역', '버섯', '고추', '된장'],
};

// ────────────────────────────────────────────
// 오행 메타
// ────────────────────────────────────────────
const ELEM_META = {
  목: { label: '木', bg: '#F0FDF4', text: '#166534', dot: '🟢' },
  화: { label: '火', bg: '#FFF5F5', text: '#991B1B', dot: '🔴' },
  토: { label: '土', bg: '#FEFCE8', text: '#854D0E', dot: '🟡' },
  금: { label: '金', bg: '#F8FAFC', text: '#475569', dot: '⚪' },
  수: { label: '水', bg: '#EFF6FF', text: '#1E40AF', dot: '🔵' },
};

const ELEM_BADGE = {
  목: '🟢 木 기운이 강한 날', 화: '🔴 火 기운이 강한 날',
  토: '🟡 土 기운이 강한 날', 금: '⚪ 金 기운이 강한 날', 수: '🔵 水 기운이 강한 날',
};

const ELEM_DESC = {
  목: '오늘은 신선하고 가벼운 음식이 목(木) 기운의 생명력을 더해줘요',
  화: '오늘은 따뜻하고 매콤한 음식이 화(火) 기운의 열정을 살려줘요',
  토: '오늘은 든든하고 부드러운 음식이 토(土) 기운의 안정을 줘요',
  금: '오늘은 담백하고 고소한 음식이 금(金) 기운의 집중력을 높여줘요',
  수: '오늘은 따뜻하고 든든한 음식이 수(Water) 기운의 냉기를 잡아줘요',
};

const RANK_NUM = ['', '🥇', '2️⃣', '3️⃣', '4️⃣', '5️⃣'];

// ────────────────────────────────────────────
// 결과 렌더링
// ────────────────────────────────────────────
function renderResult() {
  const api = MOCK_API;
  const el  = api.todayElement;

  // 날짜
  const now = new Date();
  document.getElementById('result-date').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;
  document.getElementById('result-pillar').textContent     = api.dailyPillar + '日';
  document.getElementById('result-elem-badge').textContent = ELEM_BADGE[el];
  document.getElementById('result-desc').textContent       = ELEM_DESC[el];

  // 오행 에너지 바
  document.getElementById('element-bars').innerHTML =
    Object.entries(api.elementScores).map(([key, score]) => {
      const m        = ELEM_META[key];
      const isStrong = key === el;
      return `
        <div class="elem-bar-row">
          <span class="text-xs font-bold w-5 flex-shrink-0"
            style="color:${isStrong ? '#fff' : 'rgba(255,255,255,0.6)'}">${m.label}</span>
          <div class="elem-bar-track">
            <div class="elem-bar-fill"
              style="width:${score}%;background:${isStrong ? '#fff' : 'rgba(255,255,255,0.45)'};"></div>
          </div>
          <span class="text-xs font-black w-7 text-right flex-shrink-0"
            style="color:${isStrong ? '#fff' : 'rgba(255,255,255,0.55)'}">${score}</span>
        </div>`;
    }).join('');

  // 1위 카드
  const recs = api.recommendations.slice(0, 5);
  const f1   = FOOD_ENUM[recs[0]];
  const m1   = ELEM_META[f1.element];
  const g1   = f1.group ? GROUP_ENUM[f1.group] : null;
  document.getElementById('rank1-card').innerHTML = `
    <div class="flex items-center gap-2 flex-wrap justify-center mb-1">
      <span class="text-xs font-black px-3 py-1 rounded-full text-white" style="background:#5956E9;">🥇 오늘의 1위 추천</span>
      ${g1 ? `<span class="group-tag">${g1.emoji} ${g1.label}</span>` : ''}
      <span class="elem-tag" style="background:${m1.bg};color:${m1.text};">${m1.dot} ${m1.label}</span>
    </div>
    <div class="text-5xl my-2">${f1.emoji}</div>
    <div class="text-2xl font-black text-gray-900 mb-1">${f1.name}</div>
    <div class="text-sm text-gray-500 leading-relaxed">${f1.reason}</div>
  `;

  // 2~5위 리스트
  document.getElementById('rank-list-card').innerHTML =
    recs.slice(1).map((key, i) => {
      const f    = FOOD_ENUM[key];
      if (!f) return '';
      const m    = ELEM_META[f.element];
      const g    = f.group ? GROUP_ENUM[f.group] : null;
      const rank = i + 2;
      return `
        <div class="rank-item" onclick="toggleDetail(${rank})">
          <div class="text-2xl w-9 text-center flex-shrink-0">${f.emoji}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-base">${RANK_NUM[rank]}</span>
              <span class="font-black text-sm">${f.name}</span>
              ${g ? `<span class="group-tag">${g.label}</span>` : ''}
              <span class="elem-tag" style="background:${m.bg};color:${m.text};">${m.dot} ${m.label}</span>
            </div>
            <div class="text-xs text-gray-400 mt-0.5 truncate">${f.reason}</div>
          </div>
          <i data-lucide="chevron-down" id="chevron-${rank}"
            style="width:15px;height:15px;color:#D1D5DB;flex-shrink:0;transition:transform 0.2s;"></i>
        </div>
        <div class="rank-item-detail" id="detail-${rank}">
          💡 ${f.reason}
        </div>`;
    }).join('');

  // 피해야 할 음식
  const avoidFoods = api.avoid.map(k => FOOD_ENUM[k]).filter(Boolean);
  document.getElementById('avoid-card').innerHTML = `
    <div class="flex items-center gap-2 mb-3">
      <div class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0" style="background:#FEE2E2;">
        <svg width="13" height="13" fill="none" stroke="#EF4444" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
      </div>
      <span class="font-bold text-sm text-red-700">오늘은 이런 음식을 줄여요</span>
    </div>
    <div class="flex flex-wrap gap-2 mb-3">
      ${avoidFoods.map(f => `
        <span class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold line-through text-red-400"
          style="background:#FEE2E2;">${f.emoji} ${f.name}</span>`).join('')}
    </div>
    <p class="text-xs text-red-500 leading-relaxed">${api.avoidReason}</p>
  `;

  // 식재료 태그
  document.getElementById('ingredient-tags').innerHTML =
    api.ingredients.map(ing => `<span class="ingredient-tag"># ${ing}</span>`).join('');

  lucide.createIcons();
}

function toggleDetail(rank) {
  const detail  = document.getElementById(`detail-${rank}`);
  const chevron = document.getElementById(`chevron-${rank}`);
  const isOpen  = detail.classList.toggle('open');
  chevron.style.transform = isOpen ? 'rotate(180deg)' : '';
}

window.addEventListener('scroll', () => {
  document.querySelector('.nav').style.boxShadow =
    window.scrollY > 20 ? '0 2px 12px rgba(0,0,0,0.08)' : '';
});

// 페이지 로드 시 바로 렌더링
renderResult();
</script>
</body>
</html>
