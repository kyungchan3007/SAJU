<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계정 복구 — 프로토타입</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F6F1;
      --bg-card: #FDFCF8;
      --bg-muted: #F0EDE6;
      --fg: #0d0d0d;
      --border: #0d0d0d;
      --border-light: #d4d0c8;
      --muted: #7a7570;
      --shadow: 4px 4px 0 #0d0d0d;
      --shadow-sm: 2px 2px 0 #0d0d0d;
      --yellow: #FFE500;
      --radius: 3px;
      --font-display: 'Jua', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* 상단 헤더 */
    .card-header {
      background: var(--bg-muted);
      border-bottom: 2px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo {
      font-family: var(--font-display);
      font-size: 16px;
    }

    /* 본문 */
    .card-body {
      padding: 36px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    /* 아이콘 */
    .recover-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--yellow);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 24px;
    }

    /* 안내 문구 */
    .recover-desc {
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
      background: var(--bg-muted);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 20px;
      width: 100%;
    }
    .recover-desc strong {
      color: var(--fg);
      font-weight: 700;
    }

    /* 질문 */
    .recover-question {
      font-family: var(--font-display);
      font-size: 20px;
      margin-bottom: 28px;
    }

    /* 버튼 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--fg);
      color: #fff;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-display);
      font-size: 16px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .1s;
    }
    .btn-primary:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 #0d0d0d;
    }
    .btn-secondary {
      width: 100%;
      padding: 13px;
      background: var(--bg-card);
      color: var(--muted);
      border: 2px solid var(--border-light);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: color .1s, border-color .1s;
    }
    .btn-secondary:hover {
      color: var(--fg);
      border-color: var(--border);
    }

    /* D-day 뱃지 */
    .dday-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      background: var(--yellow);
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--fg);
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
      z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <span class="header-logo">🔮 사주</span>
    </div>

    <div class="card-body">

      <div class="recover-icon">🔓</div>

      <div class="dday-badge">⏳ 탈퇴 후 23일째</div>

      <div class="recover-desc">
        탈퇴 후 <strong>30일 이전</strong>에 다시 로그인하면<br>
        기존 데이터를 복구할 수 있어요.
      </div>

      <p class="recover-question">계정을 복구하시겠어요?</p>

      <div class="btn-group">
        <button class="btn-primary" onclick="onRecover()">🔓 계정 복구</button>
        <button class="btn-secondary" onclick="onSkip()">복구하지 않기</button>
      </div>

    </div>
  </div>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function onRecover() {
    showToast('✅ 계정이 복구되었습니다');
  }

  function onSkip() {
    showToast('새 계정으로 시작합니다');
  }
</script>
</body>
</html>
