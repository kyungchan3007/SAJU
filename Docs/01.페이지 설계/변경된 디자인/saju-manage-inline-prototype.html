<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사주 관리 (인라인 편집) — 프로토타입</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F6F1;
      --bg-card: #FDFCF8;
      --bg-muted: #F0EDE6;
      --fg: #0d0d0d;
      --border: #0d0d0d;
      --border-light: #d4d0c8;
      --muted: #7a7570;
      --shadow: 4px 4px 0 #0d0d0d;
      --shadow-sm: 2px 2px 0 #0d0d0d;
      --yellow: #FFE500;
      --radius: 3px;
      --font-display: 'Jua', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 32px 20px;
    }

    /* ── 프로토 컨트롤 ── */
    .proto-bar {
      display: flex; gap: 8px; margin-bottom: 24px; justify-content: flex-end; flex-wrap: wrap;
    }
    .view-btn {
      padding: 5px 14px; border: 2px solid var(--border); border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg);
      font-family: var(--font-body);
    }
    .view-btn.active { background: var(--fg); color: #fff; }

    /* ── 레이아웃 ── */
    .container { max-width: 720px; margin: 0 auto; }
    .is-mobile .container { max-width: 390px; }

    /* ── 페이지 타이틀 ── */
    .page-title {
      font-family: var(--font-display); font-size: 22px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .page-title::after { content: ''; flex: 1; height: 2px; background: var(--border); }

    /* ── 카드 ── */
    .card {
      background: var(--bg-card); border: 2px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .card-header {
      background: var(--bg-muted); border-bottom: 2px solid var(--border);
      padding: 12px 20px; font-family: var(--font-display); font-size: 15px;
    }
    .card-body { padding: 20px; }

    /* ── 폼 ── */
    .form-grid { display: flex; flex-direction: column; gap: 20px; }
    .form-field { display: flex; flex-direction: column; gap: 7px; }
    .form-label {
      font-size: 12px; font-weight: 700; color: var(--muted);
      letter-spacing: .04em; display: flex; align-items: center; gap: 4px;
    }
    .required { color: #ef4444; }

    /* 인풋/셀렉트 */
    .form-select {
      width: 100%; padding: 11px 14px;
      border: 2px solid var(--border); border-radius: var(--radius);
      font-family: var(--font-body); font-size: 14px; font-weight: 600;
      background: var(--bg-card); color: var(--fg);
      appearance: none; -webkit-appearance: none;
      outline: none; cursor: pointer; box-shadow: var(--shadow-sm);
      transition: box-shadow .15s;
    }
    .form-select:focus { box-shadow: var(--shadow); }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾'; position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); pointer-events: none;
      font-size: 12px; color: var(--muted);
    }

    /* 날짜 3칸 */
    .date-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }

    /* 시간 2칸 */
    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* 토글 그룹 */
    .toggle-group {
      display: flex; border: 2px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .toggle-option {
      flex: 1; padding: 11px; text-align: center;
      font-size: 13px; font-weight: 700; cursor: pointer;
      border: none; background: var(--bg-card);
      font-family: var(--font-body); color: var(--fg);
      border-right: 2px solid var(--border);
    }
    .toggle-option:last-child { border-right: none; }
    .toggle-option.selected { background: var(--fg); color: #fff; }

    /* 시간 모름 */
    .time-unknown-row {
      display: flex; align-items: center; gap: 8px; margin-top: 4px;
    }
    .custom-checkbox {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-radius: 3px; background: var(--bg-card); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: var(--shadow-sm);
    }
    .custom-checkbox.checked { background: var(--fg); }
    .custom-checkbox.checked::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 900; }
    .time-unknown-label { font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }

    /* 구분선 */
    .divider {
      height: 1px; background: var(--border-light); margin: 4px 0;
    }

    /* 현재 사주 요약 뱃지 영역 */
    .summary-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      border: 2px solid var(--border); border-radius: 999px;
      padding: 4px 14px; font-size: 12px; font-weight: 700;
      background: var(--bg-card); box-shadow: var(--shadow-sm);
    }
    .badge.yellow { background: var(--yellow); }

    /* 경고 문구 */
    .field-hint {
      font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 2px;
    }
    .warn-hint {
      font-size: 11px; color: #92400e; background: #fffbeb;
      border: 1.5px solid #d97706; border-radius: var(--radius);
      padding: 8px 12px; line-height: 1.6;
    }

    /* 저장 버튼 */
    .btn-save {
      width: 100%; padding: 14px;
      background: var(--fg); color: #fff;
      border: 2px solid var(--border); border-radius: var(--radius);
      font-family: var(--font-display); font-size: 16px;
      cursor: pointer; box-shadow: var(--shadow);
      transition: transform .1s;
    }
    .btn-save:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 #0d0d0d; }

    /* 미등록 상태 */
    .empty-state {
      padding: 48px 20px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-icon { font-size: 48px; }
    .empty-title { font-family: var(--font-display); font-size: 18px; }
    .empty-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .btn-register {
      margin-top: 4px; padding: 10px 24px;
      background: var(--yellow); border: 2px solid var(--border);
      border-radius: var(--radius); font-family: var(--font-display);
      font-size: 14px; cursor: pointer; box-shadow: var(--shadow-sm);
    }

    /* 토스트 */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--fg); color: #fff;
      padding: 12px 24px; border-radius: 999px;
      font-size: 13px; font-weight: 600; box-shadow: var(--shadow);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap; z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="proto-bar">
  <button class="view-btn active" onclick="setView('web',this)">🖥 웹</button>
  <button class="view-btn" onclick="setView('mobile',this)">📱 모바일</button>
  <button class="view-btn active" onclick="setMode('registered',this)" style="margin-left:12px">사주 등록됨</button>
  <button class="view-btn" onclick="setMode('empty',this)">사주 미등록</button>
</div>

<div class="container">
  <div class="page-title">사주 관리</div>

  <!-- ══ 미등록 ══ -->
  <div id="state-empty" style="display:none">
    <div class="card">
      <div class="card-body empty-state">
        <div class="empty-icon">🔮</div>
        <div class="empty-title">아직 사주 정보가 없어요</div>
        <div class="empty-sub">생년월일·시간·성별을 입력하면<br>나만의 사주 분석을 시작할 수 있어요.</div>
        <button class="btn-register">사주 입력하기 →</button>
      </div>
    </div>
  </div>

  <!-- ══ 등록됨 ══ -->
  <div id="state-registered">

    <!-- 현재 사주 요약 -->
    <div class="card">
      <div class="card-header">나의 사주 요약</div>
      <div class="card-body">
        <div class="summary-row">
          <span class="badge yellow">🐓 닭띠</span>
          <span class="badge">신약(身弱)</span>
          <span class="badge">편인격</span>
          <span class="badge" style="background:#DBEAFE">💧 수(水)</span>
          <span class="badge" style="background:#DCFCE7">🌿 목(木)</span>
        </div>
        <p class="field-hint" style="margin-top:8px">※ 정보를 수정하면 사주 요약이 새로 계산됩니다.</p>
      </div>
    </div>

    <!-- 사주 정보 인라인 편집 -->
    <div class="card">
      <div class="card-header">사주 정보</div>
      <div class="card-body">
        <div class="form-grid">

          <!-- 양력/음력 -->
          <div class="form-field">
            <label class="form-label">양력 / 음력 <span class="required">*</span></label>
            <div class="toggle-group">
              <button class="toggle-option selected" onclick="selectToggle(this)">양력</button>
              <button class="toggle-option" onclick="selectToggle(this)">음력</button>
              <button class="toggle-option" onclick="selectToggle(this)">음력 (윤달)</button>
            </div>
          </div>

          <!-- 생년월일 -->
          <div class="form-field">
            <label class="form-label">생년월일 <span class="required">*</span></label>
            <div class="date-row">
              <div class="select-wrap">
                <select class="form-select" id="sel-year"></select>
              </div>
              <div class="select-wrap">
                <select class="form-select" id="sel-month"></select>
              </div>
              <div class="select-wrap">
                <select class="form-select" id="sel-day"></select>
              </div>
            </div>
          </div>

          <!-- 태어난 시간 -->
          <div class="form-field">
            <label class="form-label">태어난 시간</label>
            <div class="time-row" id="time-wrap">
              <div class="select-wrap">
                <select class="form-select" id="sel-hour"></select>
              </div>
              <div class="select-wrap">
                <select class="form-select" id="sel-minute"></select>
              </div>
            </div>
            <div class="time-unknown-row">
              <div class="custom-checkbox" id="time-check" onclick="toggleTime()"></div>
              <span class="time-unknown-label" onclick="toggleTime()">태어난 시간을 모릅니다</span>
            </div>
          </div>

          <!-- 성별 -->
          <div class="form-field">
            <label class="form-label">성별 <span class="required">*</span></label>
            <div class="toggle-group">
              <button class="toggle-option selected" onclick="selectToggle(this)">여성</button>
              <button class="toggle-option" onclick="selectToggle(this)">남성</button>
            </div>
          </div>

          <!-- 태어난 도시 -->
          <div class="form-field">
            <label class="form-label">태어난 도시</label>
            <div class="select-wrap">
              <select class="form-select" id="sel-city"></select>
            </div>
            <p class="field-hint">출생 도시는 사주의 지역 보정값 계산에 사용됩니다.</p>
          </div>

          <div class="divider"></div>

          <!-- 경고 -->
          <p class="warn-hint">
            ⚠️ 정보를 수정하고 저장하면 기존 분석 결과가 새로 계산됩니다. 변경 전 내용은 복원되지 않습니다.
          </p>

          <!-- 저장 버튼 -->
          <button class="btn-save" onclick="onSave()">저장하기</button>

        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast">✅ 사주 정보가 저장됐습니다</div>

<script>
  const CITIES = ['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시','세종특별자치시','수원시','고양시','용인시','성남시','춘천시','강릉시','청주시','전주시','포항시','창원시','제주시','서귀포시'];

  function fillSelect(id, options, selected) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = options.map(o =>
      `<option value="${o.v}"${o.v == selected ? ' selected' : ''}>${o.l}</option>`
    ).join('');
  }

  function initSelects() {
    fillSelect('sel-year',  Array.from({length:100},(_,i)=>({v:2005-i,l:`${2005-i}년`})), 1993);
    fillSelect('sel-month', Array.from({length:12}, (_,i)=>({v:i+1,  l:`${i+1}월`})), 10);
    fillSelect('sel-day',   Array.from({length:31}, (_,i)=>({v:i+1,  l:`${i+1}일`})), 15);
    fillSelect('sel-hour',  Array.from({length:24}, (_,i)=>{
      const ap = i < 12 ? '오전' : '오후';
      const h  = i === 0 ? '0시 (자시)' : i <= 12 ? `${i}시` : `${i-12}시`;
      return {v:i, l:`${ap} ${h}`};
    }), 9);
    fillSelect('sel-minute', Array.from({length:60},(_,i)=>({v:i,l:`${String(i).padStart(2,'0')}분`})), 0);
    fillSelect('sel-city',   CITIES.map(c=>({v:c,l:c})), '서울특별시');
  }

  initSelects();

  let timeUnknown = false;

  function toggleTime() {
    timeUnknown = !timeUnknown;
    document.getElementById('time-check').classList.toggle('checked', timeUnknown);
    const wrap = document.getElementById('time-wrap');
    wrap.style.opacity = timeUnknown ? '0.35' : '1';
    wrap.style.pointerEvents = timeUnknown ? 'none' : 'auto';
  }

  function selectToggle(el) {
    el.closest('.toggle-group').querySelectorAll('.toggle-option')
      .forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
  }

  function setView(mode, btn) {
    document.querySelectorAll('.view-btn').forEach(b => {
      if (b.textContent.includes('웹') || b.textContent.includes('모바일')) b.classList.remove('active');
    });
    btn.classList.add('active');
    document.body.classList.toggle('is-mobile', mode === 'mobile');
  }

  function setMode(mode, btn) {
    document.querySelectorAll('.view-btn').forEach(b => {
      if (b.textContent.includes('등록')) b.classList.remove('active');
    });
    btn.classList.add('active');
    const isEmpty = mode === 'empty';
    document.getElementById('state-empty').style.display = isEmpty ? 'block' : 'none';
    document.getElementById('state-registered').style.display = isEmpty ? 'none' : 'block';
  }

  function onSave() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  }
</script>
</body>
</html>
