<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>위치 추천 — 사주 기반 장소 추천</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F6F1;
      --bg-card: #FDFCF8;
      --bg-muted: #F0EDE6;
      --fg: #0d0d0d;
      --border: #0d0d0d;
      --border-light: #d4d0c8;
      --muted: #7a7570;
      --shadow: 4px 4px 0 #0d0d0d;
      --shadow-sm: 2px 2px 0 #0d0d0d;
      --yellow: #FFE500;
      --radius: 3px;
      --font-display: 'Jua', sans-serif;
      --font-body: 'Noto Sans KR', sans-serif;
      --water: #60a5fa;
      --wood: #4ade80;
      --fire: #f87171;
      --earth: #fbbf24;
      --metal: #94a3b8;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    /* ── 뷰 토글 ── */
    .view-toggle {
      position: fixed; top: 12px; right: 16px; z-index: 200;
      display: flex; gap: 6px;
    }
    .view-btn {
      padding: 5px 14px; border: 2px solid var(--border); border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      background: var(--bg-card); font-family: var(--font-body);
      box-shadow: var(--shadow-sm);
    }
    .view-btn.active { background: var(--fg); color: #fff; }

    /* ── 레이아웃 ── */
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }
    .left-panel { display: flex; flex-direction: column; gap: 16px; }
    .right-panel { position: sticky; top: 20px; display: flex; flex-direction: column; }

    /* ── 페이지 타이틀 ── */
    .page-title {
      font-family: var(--font-display);
      font-size: 26px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .page-title::after { content: ''; flex: 1; height: 2px; background: var(--border); }

    /* ── 공용 카드 ── */
    .card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-header {
      background: var(--bg-muted);
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      font-family: var(--font-display);
      font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── 용신 배너 ── */
    .yongshin-banner {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .yongshin-circle {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #DBEAFE;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }
    .yongshin-info { flex: 1; }
    .yongshin-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: .1em; color: var(--muted);
      margin-bottom: 3px;
    }
    .yongshin-name {
      font-family: var(--font-display);
      font-size: 22px; line-height: 1;
      margin-bottom: 4px;
    }
    .yongshin-desc {
      font-size: 11px; color: var(--muted); line-height: 1.5;
    }
    .yongshin-tip {
      background: var(--bg-muted);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 11px; line-height: 1.6;
      margin-top: 10px;
    }

    /* ── 장소 유형 탭 ── */
    .type-tabs {
      display: flex; gap: 8px;
    }
    .type-tab {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .1s;
    }
    .type-tab:hover { transform: translate(-1px,-1px); box-shadow: var(--shadow); }
    .type-tab.active {
      background: var(--fg); color: #fff;
      transform: translate(-1px,-1px); box-shadow: var(--shadow);
    }
    .type-tab-icon { font-size: 22px; }
    .type-tab-name { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.3; }
    .type-tab-reason { font-size: 9px; color: var(--muted); text-align: center; line-height: 1.3; }
    .type-tab.active .type-tab-reason { color: rgba(255,255,255,.6); }

    /* ── 장소 리스트 ── */
    .place-list { display: flex; flex-direction: column; }
    .place-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background .1s;
    }
    .place-item:last-child { border-bottom: none; }
    .place-item:hover { background: var(--bg-muted); }
    .place-item.selected { background: var(--yellow); }
    .place-marker {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .place-info { flex: 1; min-width: 0; }
    .place-name {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .place-address {
      font-size: 11px; color: var(--muted); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .place-dist {
      font-size: 11px; font-weight: 700;
      color: var(--muted); flex-shrink: 0;
    }
    .place-item.selected .place-dist { color: var(--fg); }

    .list-empty {
      padding: 32px 16px; text-align: center;
      font-size: 13px; color: var(--muted);
    }

    /* ── 지도 영역 ── */
    .map-container {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .map-header {
      background: var(--bg-muted);
      border-bottom: 2px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .map-header-title {
      font-family: var(--font-display); font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .map-body {
      position: relative;
      height: 460px;
      background: #e8f0e8;
      overflow: hidden;
    }

    /* 지도 mock 배경 */
    .map-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .map-road-h {
      position: absolute; left: 0; right: 0;
      height: 12px; background: #fff; opacity: .7;
    }
    .map-road-v {
      position: absolute; top: 0; bottom: 0;
      width: 12px; background: #fff; opacity: .7;
    }
    .map-water {
      position: absolute;
      background: #bfdbfe;
      border-radius: 2px;
    }
    .map-park {
      position: absolute;
      background: #bbf7d0;
      border: 1px solid #86efac;
      border-radius: 2px;
    }

    /* 지도 마커 */
    .map-marker {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer;
      transition: transform .1s;
      z-index: 10;
    }
    .map-marker:hover { transform: translate(-50%, -100%) scale(1.1); }
    .map-marker.active { transform: translate(-50%, -100%) scale(1.15); z-index: 20; }
    .marker-pin {
      width: 32px; height: 32px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm);
    }
    .marker-pin-inner {
      transform: rotate(45deg);
      font-size: 14px;
    }
    .map-marker.active .marker-pin { background: var(--yellow) !important; }
    .marker-label {
      margin-top: 4px;
      background: var(--fg); color: #fff;
      font-size: 9px; font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }
    .map-marker.active .marker-label { background: var(--yellow); color: var(--fg); }

    /* 지도 선택 정보 패널 */
    .map-info-panel {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 16px;
      display: none;
      z-index: 30;
    }
    .map-info-panel.visible { display: flex; align-items: center; gap: 12px; }
    .map-info-icon { font-size: 24px; flex-shrink: 0; }
    .map-info-name { font-size: 14px; font-weight: 700; }
    .map-info-addr { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .map-info-close {
      margin-left: auto; font-size: 18px; cursor: pointer;
      color: var(--muted); flex-shrink: 0;
      padding: 4px;
    }

    /* 지도 줌 컨트롤 */
    .map-zoom {
      position: absolute; top: 12px; right: 12px;
      display: flex; flex-direction: column; gap: 2px;
      z-index: 10;
    }
    .map-zoom-btn {
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      border-radius: var(--radius);
      font-size: 16px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    /* 내 위치 뱃지 */
    .my-location {
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #3b82f6;
      border: 3px solid #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,.3), var(--shadow-sm);
      z-index: 5;
    }

    /* ── 모바일 ── */
    .is-mobile .layout { grid-template-columns: 1fr; }
    .is-mobile .right-panel { position: static; }
    .is-mobile .map-body { height: 280px; }
    .is-mobile .shell { padding: 16px 14px 80px; }
    .is-mobile .page-title { font-size: 22px; margin-bottom: 16px; }
  </style>
</head>
<body>

<!-- 뷰 토글 -->
<div class="view-toggle">
  <button class="view-btn" onclick="setView('mobile')">📱 모바일</button>
  <button class="view-btn active" onclick="setView('web')">🖥 웹</button>
</div>

<div class="shell" id="shell">
  <div class="page-title">위치 추천</div>

  <div class="layout" id="layout">

    <!-- ── 좌 패널 ── -->
    <div class="left-panel">

      <!-- 용신 배너 -->
      <div class="yongshin-banner">
        <div class="yongshin-circle">💧</div>
        <div class="yongshin-info">
          <div class="yongshin-label">내 사주 기반 추천</div>
          <div class="yongshin-name">수(水)의 기운</div>
          <div class="yongshin-desc">용신이 수(水)인 닭띠 — 물과 자연의<br>에너지가 운기를 높여줍니다</div>
          <div class="yongshin-tip">💡 물 근처 장소가 나의 기운을 회복시켜줍니다. 아래 장소 유형을 선택해 주변 추천 장소를 확인하세요.</div>
        </div>
      </div>

      <!-- 장소 유형 탭 -->
      <div class="type-tabs" id="typeTabs">
        <div class="type-tab active" data-type="park" onclick="selectType(this, 'park')">
          <div class="type-tab-icon">🌿</div>
          <div class="type-tab-name">공원</div>
          <div class="type-tab-reason">수기운 자연</div>
        </div>
        <div class="type-tab" data-type="river" onclick="selectType(this, 'river')">
          <div class="type-tab-icon">🌊</div>
          <div class="type-tab-name">강·하천</div>
          <div class="type-tab-reason">직접 수기운</div>
        </div>
        <div class="type-tab" data-type="pool" onclick="selectType(this, 'pool')">
          <div class="type-tab-icon">🏊</div>
          <div class="type-tab-name">수영장</div>
          <div class="type-tab-reason">수기운 온몸</div>
        </div>
        <div class="type-tab" data-type="spa" onclick="selectType(this, 'spa')">
          <div class="type-tab-icon">♨️</div>
          <div class="type-tab-name">온천·찜질</div>
          <div class="type-tab-reason">수기운 이완</div>
        </div>
      </div>

      <!-- 장소 리스트 -->
      <div class="card">
        <div class="card-header">
          <span>📍</span>
          <span id="listTitle">근처 공원</span>
          <span style="margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--font-body)">카카오 검색 기준</span>
        </div>
        <div class="place-list" id="placeList"></div>
      </div>

    </div><!-- /left -->

    <!-- ── 우 패널: 지도 ── -->
    <div class="right-panel">
      <div class="map-container">
        <div class="map-header">
          <div class="map-header-title">🗺 네이버 지도</div>
          <span style="font-size:11px;color:var(--muted);font-family:var(--font-body)">장소를 선택하면 마커가 표시됩니다</span>
        </div>
        <div class="map-body" id="mapBody">
          <!-- 지도 mock 배경 -->
          <div class="map-grid"></div>
          <div class="map-road-h" style="top:30%"></div>
          <div class="map-road-h" style="top:55%"></div>
          <div class="map-road-h" style="top:75%"></div>
          <div class="map-road-v" style="left:25%"></div>
          <div class="map-road-v" style="left:55%"></div>
          <div class="map-road-v" style="left:78%"></div>
          <div class="map-water" style="bottom:8%;left:0;right:0;height:60px;border-radius:0"></div>
          <div class="map-park" style="top:35%;left:28%;width:18%;height:16%"></div>
          <div class="map-park" style="top:10%;left:60%;width:14%;height:12%"></div>

          <!-- 줌 컨트롤 -->
          <div class="map-zoom">
            <button class="map-zoom-btn">＋</button>
            <button class="map-zoom-btn">－</button>
          </div>

          <!-- 내 위치 -->
          <div class="my-location" style="top:52%;left:50%"></div>

          <!-- 마커 컨테이너 -->
          <div id="markerContainer"></div>

          <!-- 선택 정보 패널 -->
          <div class="map-info-panel" id="mapInfoPanel">
            <div class="map-info-icon" id="mapInfoIcon">🌿</div>
            <div>
              <div class="map-info-name" id="mapInfoName">–</div>
              <div class="map-info-addr" id="mapInfoAddr">–</div>
            </div>
            <div class="map-info-close" onclick="closeMapInfo()">✕</div>
          </div>
        </div>
      </div>
    </div><!-- /right -->

  </div>
</div>

<script>
  /* ── 목 데이터 ── */
  const PLACE_DATA = {
    park: {
      title: "근처 공원",
      icon: "🌿",
      color: "#bbf7d0",
      markerBg: "#4ade80",
      places: [
        { id: "p1", name: "반포한강공원", address: "서울 서초구 반포동 6-2", dist: "1.2km", x: "22%", y: "20%" },
        { id: "p2", name: "여의도한강공원", address: "서울 영등포구 여의도동 11", dist: "2.8km", x: "40%", y: "18%" },
        { id: "p3", name: "뚝섬한강공원", address: "서울 광진구 자양동 278", dist: "3.4km", x: "65%", y: "22%" },
        { id: "p4", name: "서울숲공원", address: "서울 성동구 뚝섬로 273", dist: "4.1km", x: "72%", y: "40%" },
        { id: "p5", name: "남산공원", address: "서울 중구 삼일대로 231", dist: "5.2km", x: "50%", y: "35%" },
      ]
    },
    river: {
      title: "근처 강·하천",
      icon: "🌊",
      color: "#bfdbfe",
      markerBg: "#60a5fa",
      places: [
        { id: "r1", name: "한강 반포지구", address: "서울 서초구 반포동", dist: "0.8km", x: "28%", y: "15%" },
        { id: "r2", name: "청계천 광통교", address: "서울 종로구 관철동", dist: "3.1km", x: "48%", y: "42%" },
        { id: "r3", name: "안양천", address: "서울 구로구 오류동", dist: "5.6km", x: "18%", y: "55%" },
      ]
    },
    pool: {
      title: "근처 수영장",
      icon: "🏊",
      color: "#e0e7ff",
      markerBg: "#818cf8",
      places: [
        { id: "sw1", name: "서초구민체육센터 수영장", address: "서울 서초구 남부순환로 2221", dist: "1.5km", x: "35%", y: "45%" },
        { id: "sw2", name: "잠실실내수영장", address: "서울 송파구 잠실동 10-1", dist: "3.9km", x: "68%", y: "30%" },
        { id: "sw3", name: "뚝섬수영장", address: "서울 광진구 강변북로 105", dist: "4.2km", x: "72%", y: "20%" },
      ]
    },
    spa: {
      title: "근처 온천·찜질방",
      icon: "♨️",
      color: "#fde68a",
      markerBg: "#fbbf24",
      places: [
        { id: "sp1", name: "드래곤힐스파", address: "서울 용산구 한강대로 23길 55", dist: "2.2km", x: "42%", y: "38%" },
        { id: "sp2", name: "강남 에이스 스파", address: "서울 강남구 역삼동 736", dist: "3.3km", x: "55%", y: "50%" },
        { id: "sp3", name: "신촌 워터파크 찜질방", address: "서울 서대문구 신촌로 87", dist: "4.8km", x: "28%", y: "35%" },
      ]
    }
  };

  let currentType = 'park';
  let selectedId = null;

  /* ── 장소 유형 선택 ── */
  function selectType(el, type) {
    document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentType = type;
    selectedId = null;
    renderList();
    renderMarkers();
    closeMapInfo();
  }

  /* ── 리스트 렌더 ── */
  function renderList() {
    const data = PLACE_DATA[currentType];
    document.getElementById('listTitle').textContent = data.title;
    const list = document.getElementById('placeList');
    list.innerHTML = data.places.map(p => `
      <div class="place-item ${selectedId === p.id ? 'selected' : ''}"
           onclick="selectPlace('${p.id}')" id="item-${p.id}">
        <div class="place-marker" style="background:${data.color}">
          ${data.icon}
        </div>
        <div class="place-info">
          <div class="place-name">${p.name}</div>
          <div class="place-address">${p.address}</div>
        </div>
        <div class="place-dist">${p.dist}</div>
      </div>
    `).join('');
  }

  /* ── 마커 렌더 ── */
  function renderMarkers() {
    const data = PLACE_DATA[currentType];
    const container = document.getElementById('markerContainer');
    container.innerHTML = data.places.map(p => `
      <div class="map-marker ${selectedId === p.id ? 'active' : ''}"
           id="marker-${p.id}"
           style="left:${p.x};top:${p.y}"
           onclick="selectPlace('${p.id}')">
        <div class="marker-pin" style="background:${data.color}">
          <div class="marker-pin-inner">${data.icon}</div>
        </div>
        <div class="marker-label">${p.name.length > 6 ? p.name.slice(0,6)+'…' : p.name}</div>
      </div>
    `).join('');
  }

  /* ── 장소 선택 ── */
  function selectPlace(id) {
    const data = PLACE_DATA[currentType];
    const place = data.places.find(p => p.id === id);
    if (!place) return;

    selectedId = id;
    renderList();
    renderMarkers();

    // 지도 정보 패널
    document.getElementById('mapInfoIcon').textContent = data.icon;
    document.getElementById('mapInfoName').textContent = place.name;
    document.getElementById('mapInfoAddr').textContent = place.address + ' · ' + place.dist;
    document.getElementById('mapInfoPanel').classList.add('visible');
  }

  function closeMapInfo() {
    document.getElementById('mapInfoPanel').classList.remove('visible');
    selectedId = null;
    renderList();
    renderMarkers();
  }

  /* ── 뷰 토글 ── */
  function setView(mode) {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    const shell = document.getElementById('shell');
    if (mode === 'mobile') shell.classList.add('is-mobile');
    else shell.classList.remove('is-mobile');
    setTimeout(syncMapHeight, 50);
  }

  /* ── 지도 높이를 왼쪽 패널에 맞춤 ── */
  function syncMapHeight() {
    const left = document.querySelector('.left-panel');
    const mapBody = document.getElementById('mapBody');
    const shell = document.getElementById('shell');
    if (shell.classList.contains('is-mobile')) {
      mapBody.style.height = '280px';
      return;
    }
    if (left && mapBody) {
      const h = left.offsetHeight;
      // map-header(42px) + border(4px) 제외
      mapBody.style.height = Math.max(300, h - 46) + 'px';
    }
  }

  /* 초기 렌더 */
  renderList();
  renderMarkers();
  setTimeout(syncMapHeight, 50);
  window.addEventListener('resize', syncMapHeight);
</script>
</body>
</html>
